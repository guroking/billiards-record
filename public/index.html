<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대학별 당구 전적 기록</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #333; }
        select, button { padding: 10px; font-size: 16px; margin-top: 20px; width: 100%; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 당구 전적 기록</h1>
        <p>어느 대학교로 입장하시겠습니까?</p>
        
        <select id="universitySelect">
            <option value="kmou">한국해양대학교</option>
            <option value="dmu">동양미래대학교</option>
            <option value="yuhan">유한대학교</option>
            <option value="dankook">단국대학교</option>
            <option value="cbnu">충북대학교</option>
        </select>
        
        <button onclick="enterUniversity()">입장하기</button>
    </div>

    <script>
        function enterUniversity() {
            const code = document.getElementById('universitySelect').value;
            // 선택한 대학교 코드를 주소에 달아서 공통 대시보드로 이동
            window.location.href = `/dashboard.html?uni=${code}`;
        }
    </script>
</body>
</html>
